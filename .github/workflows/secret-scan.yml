# シークレット検出（gitleaks）— 配布元は hicard の tools/github_ci/
#
# なぜサーバ側でも見るのか:
#   hicard-inc は GitHub Free のため、private リポジトリでは Push Protection が使えない。
#   ローカルの pre-push hook（hooks/pre-push）は `git config core.hooksPath hooks` を
#   clone した人が各自1回実行しないと無効で、`git push --no-verify` でも外れる。
#   設定忘れと意図的な回避を拾う網として、同じ検査をサーバ側で二重に回す。
#
# なぜ公式の gitleaks/gitleaks-action を使わないのか:
#   gitleaks-action v2 は **Organization のリポジトリでは GITLEAKS_LICENSE が必須**（有料）。
#   Free プラン維持の方針と両立しないため、リリースのバイナリを直接落として実行する。
#
# 無効化のしかた（巻き戻し）: このファイルを削除するか、Actions タブで workflow を disable する。
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # 2026-09-02 に全10リポジトリの全履歴を監査したのと同じ版に固定する（結果の再現性のため）
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 差分スキャンで base..head を辿るため全履歴を取る
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # いま置かれているファイルの検査。--redact でヒットした値そのものはログに出さない
      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact --exit-code 1

      # 「追加してから同じPR内で消した」ケースは作業ツリーだけ見ても分からないため、
      # 追加されたコミットの範囲も履歴として検査する
      - name: Scan added commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE}..${GITHUB_SHA}"
          else
            # ブランチ新規作成時など差分の起点が無い場合。作業ツリーの検査で足りているのでここは飛ばす
            echo "差分の起点が特定できないため、コミット範囲の検査は省略します。"
            exit 0
          fi
          echo "検査範囲: ${range}"
          gitleaks git . --log-opts="${range}" --no-banner --redact --exit-code 1
